# Gera os aplicativos de computador e os anexa a uma Release.
#
# Dispara ao criar uma tag `v*` (ex.: `git tag v1.0.0 && git push --tags`) ou
# à mão, em Actions → "Publicar desktop" → "Run workflow".
#
# Um job só, no Linux: o Electron Packager baixa o runtime pronto de cada
# plataforma, então não é preciso um Mac nem um Windows para empacotar. Os
# binários saem **sem assinatura** — ao abrir, o Windows e o macOS vão avisar
# que o autor não é identificado. Para a entrega do hackathon isso basta;
# assinar exige certificado pago (e, no macOS, conta de desenvolvedor Apple).
name: Publicar desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  empacotar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Nada é publicado sem passar na verificação.
      - run: npm run verify

      - name: Exportar o app web
        run: npm run build:web

      - name: Preparar a pasta do invólucro
        run: |
          rm -rf desktop/dist-web
          cp -r dist-web desktop/dist-web

      - name: Empacotar Linux, Windows e macOS
        run: |
          for alvo in linux win32 darwin; do
            npx --yes @electron/packager@18 desktop "Dr. Moo" \
              --platform=$alvo --arch=x64 \
              --electron-version=33.4.11 \
              --out=dist-desktop --overwrite
          done

      - name: Compactar cada aplicativo
        run: |
          cd dist-desktop
          for pasta in */; do
            nome="${pasta%/}"
            # Espaço em nome de arquivo complica download por linha de comando.
            arquivo="$(echo "$nome" | tr ' ' '-')"
            zip -r -q "../${arquivo}.zip" "$nome"
          done
          cd ..
          ls -lh *.zip

      - name: Anexar à Release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
          # Em execução manual não há tag: publica como rascunho para você
          # revisar e nomear antes de divulgar.
          draft: ${{ github.ref_type != 'tag' }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'desktop-preview' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Prévia do aplicativo de computador' }}
          body: |
            Aplicativos de computador do Dr. Moo, gerados a partir do app web exportado.

            | Sistema | Arquivo |
            |---|---|
            | Linux | `Dr.-Moo-linux-x64.zip` |
            | Windows | `Dr.-Moo-win32-x64.zip` |
            | macOS | `Dr.-Moo-darwin-x64.zip` |

            Descompacte e execute. Os binários não são assinados: no Windows,
            clique em "Mais informações → Executar assim mesmo"; no macOS,
            clique com o botão direito → Abrir.

            O app roda offline: o banco fica no próprio computador.
