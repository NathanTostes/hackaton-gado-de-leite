# Verificação a cada push e pull request: typecheck + suíte de testes.
#
# É o mínimo que impede que a base de conhecimento, o motor ou a planilha
# quebrem sem ninguém perceber — e roda em menos de dois minutos.
name: Verificar

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck e testes
        run: npm run verify
